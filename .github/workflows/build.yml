name: Windows portable build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: codex-tokenuse-windows-x64
          path: |
            dist/codex-tokenuse-*-windows-x64.zip
            dist/SHA256SUMS.txt
